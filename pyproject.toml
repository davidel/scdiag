[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scdiag"
version = "0.1.0"
description = "Train, pre-train, and evaluate image-classification models for skin-lesion diagnosis."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "transformers",
    "datasets",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage"]
s3 = ["boto3>=1.28"]
lora = ["peft>=0.7.0"]
timm = ["timm>=1.0"]
uvito = ["segmentation_models_pytorch>=0.3.0"]
dev = ["pytest", "ruff", "yapf", "tensorboard"]

[project.scripts]
scdiag-train = "scdiag.train:main"
scdiag-pretrain = "scdiag.pretrain:main"
scdiag-infer = "scdiag.infer:main"

[tool.setuptools.packages.find]
include = ["scdiag*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
ignore = ["LOG015", "PLC0415", "RUF012", "PLR0402"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "error",
  # Known sandbox limitation: joblib falls back to serial mode when a
  # shared-memory segment cannot be created. Fires at test collection.
  "ignore:\\[Errno 13\\] Permission denied.*joblib:UserWarning",
]
