[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scdiag"
version = "0.1.0"
description = "Fine-tune HuggingFace vision models for skin-lesion classification."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "transformers",
    "datasets",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage"]
dev = ["pytest", "ruff"]

[project.scripts]
scdiag-train = "scdiag.train:main"
scdiag-infer = "scdiag.infer:main"

[tool.setuptools.packages.find]
include = ["scdiag*"]
